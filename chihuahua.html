    <p><The Chihuahua or Chihuahueño is a Mexican breed of toy dog and the smallest recognized dog breed in the world. It is primarily kept as a companion animal and is characterized by its compact size, large erect ears, and rounded skull. The breed occurs in both short- and long-coated varieties, with a wide range of colors and patterns./p>
